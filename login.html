<head>
<!-- Apply saved light/dark choice before paint (avoids a flash when the device default differs from the toggle) -->
<script>
try{var t=localStorage.getItem('theme');if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t);}catch(e){}
try{if(localStorage.getItem('tk-announcement-collapsed'))document.documentElement.classList.add('ann-collapsed');}catch(e){}
(function(){var d=document.documentElement;d.classList.add('fonts-loading');var done=false;function fin(){if(done)return;done=true;d.classList.remove('fonts-loading');}setTimeout(fin,500);try{if(document.fonts&&document.fonts.load){Promise.all([document.fonts.load('1em Freeman'),document.fonts.load('1em "Great Vibes"')]).then(fin,fin);}else{fin();}}catch(e){fin();}})();
</script>

			  50% { background-color: #d7ba6480 }

			}
			/* Loading spinner shown behind the TutorBird widget until it renders */
			.widget-spinner {
				position: absolute;
				top: 50%;
				left: 50%;
				width: 34px;
				height: 34px;
				margin: -17px 0 0 -17px;
				border: 3px solid #e5e5e5;
				border-top-color: #d46a53;

			@keyframes widget-spin { to { transform: rotate(360deg); } }
			/* The two links sit above the login box: side by side when they fit,

			.login-links {
				display: flex;
				flex-wrap: wrap;
				justify-content: center;
				align-items: stretch;
				gap: 0;
				margin-bottom: 0.5em;
				/* wider than the 500px login column, so both fit on one line when
				   the screen allows; they wrap and centre when it does not */
				width: min(620px, 92vw);
				margin-left: 50%;
				transform: translateX(-50%);
			}

			.login-links .button { display: inline-block; }
			.login-links .button div { margin: 6px; }

			.login-notes {
				list-style: none;

			.login-notes li i {
				color: var(--defaultlink, #d46a53);
				margin-top: 3px;
				justify-self: start;
			}
		</style>

			<script>
				// Hide the spinner once the TutorBird widget has rendered (gains
				// height), or after a timeout fallback so it never spins forever.
				(function () {
					var target = document.getElementById('login-widget-target');
					var spinner = document.getElementById('login-widget-spinner');
					if (!target || !spinner) return;
					var start = Date.now();
					var iv = setInterval(function () {
						if (target.offsetHeight > 40 || Date.now() - start > 20000) {
							spinner.style.display = 'none';
							clearInterval(iv);
						}
					}, 150);
				})();
			</script>
