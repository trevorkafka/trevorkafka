<script>
	// Light/dark toggle. The theme itself is applied earlier (script.js reads
	// localStorage; CSS handles the device default), so this only flips the
	// choice on click and keeps the icon in sync.
	(function setupThemeToggle() {
		var btn = document.getElementById('theme-toggle');
		if (!btn) return;
		var root = document.documentElement;
		var mq = window.matchMedia('(prefers-color-scheme: dark)');

		function effective() {
			var a = root.getAttribute('data-theme');
			if (a === 'dark' || a === 'light') return a;
			return mq.matches ? 'dark' : 'light';
		}
		function iconEl() {
			var w = btn.querySelector('.tt-icon');
			if (!w) {
				btn.textContent = '';   // remove the hardcoded pre-JS icon so we don't double up
				w = document.createElement('span');
				w.className = 'tt-icon';
				btn.appendChild(w);
			}
			return w;
		}
		function glyph(dark) {
			return '<i class="fa-solid ' + (dark ? 'fa-sun' : 'fa-moon') + ' fa-fw"></i>';
		}
		function setLabel(dark) {
			var label = dark ? 'Switch to light mode' : 'Switch to dark mode';
			btn.setAttribute('aria-label', label);
			btn.setAttribute('title', label);
		}
		function updateIcon() {
			var dark = effective() === 'dark';
			var host = iconEl();
			var g = host.querySelector('.tt-glyph');
			if (!g) { g = document.createElement('span'); g.className = 'tt-glyph'; host.appendChild(g); }
			g.innerHTML = glyph(dark);
			setLabel(dark);
		}
		var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
		// Rotation increments 180° per click. Parity is anchored so the moon (light
		// mode) always rests upright at even multiples of 180°; the sun is radially
		// symmetric, so odd multiples look identical.
		var rot = effective() === 'dark' ? 180 : 0;
		function toggle() {
			var next = effective() === 'dark' ? 'light' : 'dark';
			root.setAttribute('data-theme', next);
			try { localStorage.setItem('theme', next); } catch (e) {}
			var dark = next === 'dark';
			if (reduceMotion) { updateIcon(); return; }
			// Spin the icon 180° and cross-fade the outgoing/incoming glyphs.
			rot += 180;
			var host = iconEl();
			host.style.transform = 'rotate(' + rot + 'deg)';
			var old = host.querySelector('.tt-glyph');
			var g = document.createElement('span');
			g.className = 'tt-glyph';
			g.style.opacity = '0';
			g.innerHTML = glyph(dark);
			host.appendChild(g);
			void g.offsetWidth;   // reflow so the opacity transition runs
			g.style.opacity = '1';
			if (old) old.style.opacity = '0';
			setTimeout(function () { if (old && old.parentNode) old.parentNode.removeChild(old); }, 400);
			setLabel(dark);
		}
		btn.addEventListener('click', toggle);
		btn.addEventListener('keydown', function (e) {
			if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); }
		});
		// Follow live OS changes only while the visitor hasn't chosen explicitly.
		mq.addEventListener('change', function () {
			if (!root.getAttribute('data-theme')) updateIcon();
		});
		updateIcon();
		// Apply the initial rotation without animating, so the parity is set for
		// the first click (invisible for the symmetric sun).
		if (!reduceMotion && rot) {
			var w = iconEl();
			w.style.transition = 'none';
			w.style.transform = 'rotate(' + rot + 'deg)';
			void w.offsetWidth;
			w.style.transition = '';
		}
	})();
</script>
