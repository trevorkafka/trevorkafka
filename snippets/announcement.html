<style>
	#announcement-box {
		cursor: pointer;
		-webkit-tap-highlight-color: transparent;
	}

	/* "NEW" chip: light red pill in light mode, deeper pill in dark mode. */
	#announcement-box .announcement-new {
		background: #f6d5d5;
		color: #b02a1e;
		font-family: Arial, sans-serif;
		font-size: 75%;
		font-weight: bold;
		letter-spacing: 0.05em;
		padding: 1px 7px;
		border-radius: 999px;
		vertical-align: middle;
	}

	:root[data-theme="dark"] #announcement-box .announcement-new {
		background: #4d2320;
		color: #ff9a8c;
	}

	@media (prefers-color-scheme: dark) {
		:root:not([data-theme="light"]) #announcement-box .announcement-new {
			background: #4d2320;
			color: #ff9a8c;
		}
	}

	/* the leading "Announcement (...)" label matches the collapsed pill's look */
	#announcement-box strong {
		font-family: "Freeman", sans-serif;
		font-weight: normal;
		color: var(--color1);
	}

	#announcement-box ul {
		padding-left: 25px;
		padding-bottom: 15px;
		margin-top: 5px;
	}

	#announcement-box li {
		margin: 4px 0;
	}

	#announcement-box a {
		cursor: pointer;
	}

	#announcement-collapse {
		position: absolute;
		top: 8px;
		right: 8px;
		margin: 0;
		padding: 5px 9px;
		width: auto;
		background: none;
		border: none;
		border-radius: 6px;
		color: var(--color1);
		cursor: pointer;
		font-size: 90%;
		transition: background-color 0.2s ease;
	}

	#announcement-collapse:hover {
		background-color: #00000015;
	}

	.announcement-pill-wrap {
		margin-bottom: -40px;
	}

	#announcement-pill {
		display: inline-flex;
		align-items: center;
		gap: 0.5em;
		margin: 0;
		width: auto;
		padding: 8px 18px;
		background: var(--color3);
		border: solid 1.5px var(--surface-border);
		border-radius: 999px;
		color: var(--color1);
		font-family: "Freeman", sans-serif;
		/* inherit from .announcement so the pill matches the expanded box's
		   text size, including the narrow-screen override in style.css */
		font-size: 100%;
		cursor: pointer;
		-webkit-tap-highlight-color: transparent;
		transition: background-color 0.2s ease;
	}

	#announcement-pill:hover {
		background-color: var(--tint-4);
	}
</style>

<script>
	(function () {
		var box  = document.getElementById('announcement-box');
		var wrap = document.getElementById('announcement-pill-wrap');
		if (!box || !wrap) return;

		// Key the collapsed state to a hash of the announcement text, so a new
		// or edited announcement automatically reappears for everyone.
		var text = (box.textContent || '').replace(/\s+/g, ' ').trim();
		var hash = 5381;
		for (var i = 0; i < text.length; i++) hash = ((hash * 33) ^ text.charCodeAt(i)) >>> 0;
		var KEY = 'tk-announcement-collapsed';

		function setCollapsed(collapsed) {
			box.hidden = collapsed;
			wrap.hidden = !collapsed;
			try {
				if (collapsed) localStorage.setItem(KEY, String(hash));
				else localStorage.removeItem(KEY);
			} catch (e) {} /* private browsing etc.: still toggles, just doesn't persist */
		}

		var stored = null;
		try { stored = localStorage.getItem(KEY); } catch (e) {}
		setCollapsed(stored === String(hash));

		document.getElementById('announcement-collapse').addEventListener('click', function () { setCollapsed(true); });
		document.getElementById('announcement-pill').addEventListener('click', function () { setCollapsed(false); });

		// Clicking anywhere on the box that isn't already a click target (a link,
		// or the collapse button itself) also collapses the announcement.
		box.addEventListener('click', function (e) {
			if (e.target.closest('a') || e.target.closest('button')) return;
			// selecting/copying announcement text shouldn't collapse the box
			var sel = window.getSelection && window.getSelection();
			if (sel && !sel.isCollapsed && box.contains(sel.anchorNode)) return;
			setCollapsed(true);
		});
	})();
</script>
